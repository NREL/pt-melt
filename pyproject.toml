[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptmelt"
version = "0.1.4"
description = "PyTorch Machine Learning Toolbox (PT-MELT)"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Nicholas T. Wimer", email = "nwimer@nrel.gov" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pytest",
  "torchinfo",
  "tqdm",
  "scikit-learn",
  "matplotlib",
  "ray[data,train,tune,serve]",
  "hyperopt",
  "optuna",
  "hpbandster",
  "ConfigSpace",
  "bayesian-optimization",
  "ax-platform",
  "safetensors",
  "torch",
  "torchvision",
  "torchaudio",
]

[project.urls]
Homepage = "https://github.com/NREL/pt-melt"

[project.optional-dependencies]
dev = ["ruff", "ipython"]
test = ["pytest", "pytest-cov"]
doc = ["sphinx", "myst-parser", "pydata-sphinx-theme"]

[tool.setuptools.packages.find]
include = ["ptmelt*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev", "doc", "test"], solve-group = "default" }
doc = { features = ["doc"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.pypi-dependencies]
ptmelt = { path = ".", editable = true }

[tool.pixi.feature.dev.tasks]
lint = "ruff check ./ptmelt"
format = "ruff format ./ptmelt"

[tool.pixi.feature.test.tasks]
tests = "pytest -vv ptmelt/"

[tool.pixi.feature.doc.tasks]
docs = { cmd = "make html", cwd = "Docs" }

[tool.pixi.dependencies]
torchinfo = ">=1.8.0,<2"
tqdm = ">=4.68.2,<5"
scikit-learn = ">=1.9.0,<2"
matplotlib = ">=3.11.0,<4"
ray-default = ">=2.55.1,<3"
ray-data = ">=2.55.1,<3"
ray-train = ">=2.55.1,<3"
ray-tune = ">=2.55.1,<3"
ray-serve = ">=2.55.1,<3"
hyperopt = ">=0.2.7,<0.3"
optuna = ">=4.9.0,<5"
hpbandster = ">=0.7.4,<0.8"
configspace = ">=1.2.2,<2"
bayesian-optimization = ">=3.3.0,<4"
ax-platform = ">=1.2.4,<2"
safetensors = ">=0.8.0,<0.9"
pytorch = ">=2.11.0,<3"
torchvision = ">=0.26.0,<0.27"
torchaudio = ">=2.11.0,<3"
